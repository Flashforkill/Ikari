<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>BG3 Honour Mode Kill Counter</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #000;
      --text-color: #fff;
      --card-bg: #1a1a1a;
      --border-color: #888;
      --button-bg: #3e2d16;
      --button-text: #f5e4c3;
      --button-border: #b19973;
    }

    .light-mode {
      --bg-color: #fefbf3;
      --text-color: #1a1a1a;
      --card-bg: #fff6e6;
      --border-color: #aaa;
      --button-bg: #e6d5a8;
      --button-text: #1a1a1a;
      --button-border: #604c2e;
    }

    body {
      font-family: 'IM Fell English SC', serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 40px;
      text-align: center;
      background-image: url('https://www.transparenttextures.com/patterns/dark-mosaic.png');
    }

    h1, h2 {
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    .controls {
      margin-bottom: 20px;
    }

    input[type="text"], select {
      padding: 10px;
      font-size: 1em;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
    }

    button {
      padding: 10px 14px;
      margin: 5px;
      font-size: 1em;
      cursor: pointer;
      background: var(--button-bg);
      color: var(--button-text);
      border: 2px solid var(--button-border);
      border-radius: 10px;
    }

    button:hover {
      background: var(--button-border);
      color: var(--bg-color);
    }

    .counter-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .dial {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      min-width: 200px;
    }

    .count {
      font-size: 2em;
      margin: 10px 0;
    }

    .btns {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .class-label {
      font-size: 0.9em;
      margin-top: 5px;
    }

    #themeToggle {
      position: absolute;
      top: 10px;
      right: 10px;
    }
  </style>
</head>
<body>
  <button id="themeToggle" onclick="toggleTheme()">🌙</button>

  <h1>Baldur's Gate 3 – Honour Mode Kill Counter</h1>

  <div class="controls">
    <input type="text" id="charName" placeholder="Character name">
    <select id="charClass">
      <option value="">Select class</option>
      <option>Barbarian</option>
      <option>Bard</option>
      <option>Cleric</option>
      <option>Druid</option>
      <option>Fighter</option>
      <option>Monk</option>
      <option>Paladin</option>
      <option>Ranger</option>
      <option>Rogue</option>
      <option>Sorcerer</option>
      <option>Warlock</option>
      <option>Wizard</option>
    </select>
    <button onclick="addCharacter()">Add</button>
    <button onclick="resetAll()">Reset All</button>
    <button onclick="partyDead()">Party Dead</button>
    <button onclick="reviveAll()">Revive Party</button>
  </div>

  <h2>Current Party</h2>
  <div id="counterContainer" class="counter-container"></div>

  <h2>Fallen Party Members</h2>
  <div id="graveyardContainer" class="counter-container"></div>

  <script>
    let party = JSON.parse(localStorage.getItem('party')) || {};
    let graveyard = JSON.parse(localStorage.getItem('graveyard')) || {};

    function saveData() {
      localStorage.setItem('party', JSON.stringify(party));
      localStorage.setItem('graveyard', JSON.stringify(graveyard));
    }

    function renderCharacters() {
      const container = document.getElementById('counterContainer');
      container.innerHTML = '';
      for (const [id, char] of Object.entries(party)) {
        const el = document.createElement('div');
        el.className = 'dial';
        el.innerHTML = `
          <div><strong>${char.name}</strong></div>
          ${char.class ? `<div class="class-label">Class: ${char.class}</div>` : ''}
          <div class="count">${char.kills}</div>
          <div class="btns">
            <button onclick="incrementKill('${id}')">+</button>
            <button onclick="decrementKill('${id}')">–</button>
            <button onclick="removeCharacter('${id}')">×</button>
          </div>
        `;
        container.appendChild(el);
      }
    }

    function renderGraveyard() {
      const container = document.getElementById('graveyardContainer');
      container.innerHTML = '';
      for (const [id, char] of Object.entries(graveyard)) {
        const el = document.createElement('div');
        el.className = 'dial';
        el.innerHTML = `
          <div><strong>${char.name}</strong></div>
          ${char.class ? `<div class="class-label">Class: ${char.class}</div>` : ''}
          <div class="count">${char.kills}</div>
        `;
        container.appendChild(el);
      }
    }

    function addCharacter() {
      const name = document.getElementById('charName').value.trim();
      const className = document.getElementById('charClass').value.trim();
      if (!name) return alert('Enter a character name!');
      const id = Date.now().toString();
      party[id] = { name, kills: 0, class: className };
      document.getElementById('charName').value = '';
      document.getElementById('charClass').selectedIndex = 0;
      saveData();
      renderCharacters();
    }

    function incrementKill(id) {
      party[id].kills += 1;
      saveData();
      renderCharacters();
    }

    function decrementKill(id) {
      party[id].kills = Math.max(0, party[id].kills - 1);
      saveData();
      renderCharacters();
    }

    function removeCharacter(id) {
      if (confirm('Delete this character?')) {
        delete party[id];
        saveData();
        renderCharacters();
      }
    }

    function resetAll() {
      if (confirm('Reset all kill counts?')) {
        for (const id in party) {
          party[id].kills = 0;
        }
        saveData();
        renderCharacters();
      }
    }

    function partyDead() {
      if (confirm('Move all characters to the graveyard?')) {
        graveyard = { ...graveyard, ...party };
        party = {};
        saveData();
        renderCharacters();
        renderGraveyard();
      }
    }

    function reviveAll() {
      if (confirm('Revive all fallen characters?')) {
        party = { ...party, ...graveyard };
        graveyard = {};
        saveData();
        renderCharacters();
        renderGraveyard();
      }
    }

    function toggleTheme() {
      const body = document.body;
      body.classList.toggle('light-mode');
      const isLight = body.classList.contains('light-mode');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      document.getElementById('themeToggle').textContent = isLight ? '☀️' : '🌙';
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('themeToggle').textContent = '☀️';
      } else {
        document.getElementById('themeToggle').textContent = '🌙';
      }
      renderCharacters();
      renderGraveyard();
    });
  </script>
</body>
</html>
